# Step 3: once every td2hive-run-units pod has completed, register every
# partition, verify() the whole job once, and write the one AuditRecord.
# Apply this only after confirming td2hive-run-units succeeded (see
# k8s/run-all.sh) - plain k8s Jobs have no built-in "wait for that other
# Job" primitive; Argo Workflows/Airflow (see integrations/) express this
# dependency natively instead of needing a wrapper script to poll it.
apiVersion: batch/v1
kind: Job
metadata:
  name: td2hive-reconcile
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          image: td2hive-tpt:latest # or td2hive:latest - reconcile() never touches TPT/DataX
          command: ["td2hive"]
          args:
            - reconcile
            - --job=/app/jobs/${JOB_NAME}.yaml
            - --processing-date=${PROCESSING_DATE}
            - --results-dir=/plan/results
          envFrom:
            - secretRef:
                name: td2hive-credentials
          volumeMounts:
            - name: plan
              mountPath: /plan
      volumes:
        - name: plan
          persistentVolumeClaim:
            claimName: td2hive-plan
