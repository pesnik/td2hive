[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "td2hive"
version = "0.1.0"
description = "Teradata -> Hive (MRS/HetuEngine) backup pipeline: TPT extraction, DataX (stock plugins) loading, independent verification, pluggable audit."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "pesnik" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "click>=8.1",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "boto3>=1.34",
    "teradatasql>=17.20",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg2-binary>=2.9"]
openlineage = ["openlineage-client>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "black>=24.0", "mypy>=1.10"]

[project.scripts]
td2hive = "td2hive.cli:cli"

[project.urls]
Repository = "https://github.com/pesnik/td2hive"

[tool.setuptools.packages.find]
include = ["td2hive*"]

[tool.setuptools.package-data]
td2hive = ["jobs/*.yaml"]
